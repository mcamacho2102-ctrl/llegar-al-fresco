name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compila todo el código
        run: python -m compileall -q ciudad mcp
      - name: Pruebas unitarias (sin datos ni servidor)
        run: python -m unittest pruebas.test_unidades -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Tipos y compilación de la web
        run: npm --prefix web run build
      - name: Rutas de la versión piloto
        run: node comprobar-rutas.js
